[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops"
version = "0.1.0"
description = "Background AIOps for local kind Kubernetes clusters: anomaly detection, LLM RCA (Ollama/Qwen), guarded fixes and SOP generation."
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.5",
    "langchain-ollama>=1.0",
    "langchain>=1.0",
    "langgraph",
    "mcp<2.0.0",
    "langchain_mcp_adapters",
    "pydantic>=2",
]

[project.scripts]
aiops = "aiops.cli:main"

[tool.setuptools]
packages = ["aiops"]
