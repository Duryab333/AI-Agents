# Triggers: OOMKilled -- expected fix: patch_resource_limits (raise memory_limit)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-app
  template:
    metadata:
      labels:
        app: oom-app
    spec:
      containers:
        - name: app
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            limits:
              memory: "50Mi"
            requests:
              memory: "50Mi"
